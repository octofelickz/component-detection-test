name: Component Detection

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

jobs:
  dependency-submission:
    name: Restore and submit dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Restore root npm project
        run: npm ci

      - name: Restore nested frontend npm project
        run: npm ci --prefix frontend

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet project
        run: dotnet restore dotnet/ComponentDetectionTest.csproj

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: maven/pom.xml

      - name: Restore Maven project
        run: mvn --batch-mode --file maven/pom.xml dependency:go-offline

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: go/go.sum

      - name: Restore Go module
        working-directory: go
        run: go mod download

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Restore Ruby gems
        run: bundle install --gemfile ruby/Gemfile

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Restore Python requirements and generate pip report
        run: |
          python -m venv "${RUNNER_TEMP}/component-detection-python"
          "${RUNNER_TEMP}/component-detection-python/bin/python" -m pip install \
            --report python/component-detection-pip-report.json \
            --requirement python/requirements.txt

      - name: Submit Component Detection snapshot
        uses: advanced-security/component-detection-dependency-submission-action@felickz-fix-npm-snapshot-manifests
        with:
          correlator: multi-ecosystem-integration
